spring:
  application:
    name: rentdetective
  profiles:
    active: dev

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: io.github.shardkiht.rentdetective.**.entity
  configuration:
    map-underscore-to-camel-case: true

rule:
  threshold:
    suspicious: 0.6
    review: 0.4

rag:
  embed-on-startup: false
